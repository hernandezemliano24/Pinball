<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyber Pinball Arena</title>
<link rel="stylesheet" href="styles.css?v=13">
</head>
<body>
<main class="wrap">
  <section class="cabinet">
    <canvas id="game" width="900" height="1100"></canvas>
    <div class="touch">
      <button id="leftTouch">LEFT</button>
      <button id="launchTouch">LAUNCH</button>
      <button id="rightTouch">RIGHT</button>
    </div>
  </section>

  <aside class="panel">
    <p class="eyebrow">AWS // CYBER ARCADE</p>
    <h1>CYBER PINBALL</h1>
    <p class="sub">OPEN FIELD EDITION</p>
    <div class="stats">
      <div><span>SCORE</span><b id="score">0000000</b></div>
      <div><span>BALLS</span><b id="balls">3</b></div>
      <div><span>COMBO</span><b id="combo">0</b></div>
      <div><span>HIGH</span><b id="high">0000000</b></div>
    </div>
    <div class="mission">
      <span>STATUS</span>
      <b id="status">READY</b>
      <p id="message">Hold SPACE to charge. Release to launch.</p>
    </div>
    <div class="controls">
      <p><kbd>A</kbd> / <kbd>←</kbd> Left flipper</p>
      <p><kbd>D</kbd> / <kbd>→</kbd> Right flipper</p>
      <p><kbd>SPACE</kbd> Launch ball</p>
      <p><kbd>R</kbd> Restart</p>
      <p><kbd>P</kbd> Pause</p>
    </div>
    <p class="node">EC2 NODE: <span id="az">__AZ__</span></p>
  </aside>
</main>
<script src="game.js?v=13"></script>
</body>
</html>
